services:
  db:
    image: postgres:16
    container_name: veterinaria_db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    container_name: veterinaria_odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      # Origen del frontend que puede llamar a la API (en producción, su URL exacta)
      VET_CORS_ORIGIN: "${VET_CORS_ORIGIN:-*}"
    # La API necesita saber qué base de datos usar ($$ es un signo $ en compose)
    command: ["odoo", "--db-filter=^veterinaria$$"]
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

volumes:
  pgdata:
  odoo-data:
